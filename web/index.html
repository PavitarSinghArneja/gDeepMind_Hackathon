<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnapSort</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>SnapSort</h1>
      <p id="summary" class="summary">Reading your folders…</p>
    </div>
    <div class="status" aria-live="polite">
      <span id="pill-net" class="pill">Checking network</span>
      <span id="pill-model" class="pill">Checking model</span>
      <span id="pill-queue" class="pill">–</span>
    </div>
  </header>

  <form id="ask" class="ask" autocomplete="off">
    <label for="ask-q" class="visually-hidden">Ask about your files</label>
    <input id="ask-q" placeholder="Ask about your files, e.g. “what's the WiFi password?” or “when is the electricity bill due?”">
    <button type="submit">Ask</button>
  </form>
  <div id="answer" class="answer hidden" aria-live="polite"></div>

  <main class="grid">
    <section class="col col-inbox" aria-labelledby="h-inbox">
      <h2 id="h-inbox">Needs you <span id="inbox-count" class="count"></span></h2>
      <div id="inbox"></div>
      <h2>Coming up</h2>
      <ul id="reminders" class="list"></ul>
      <h2>Export expenses</h2>
      <div class="export">
        <div class="row presets">
          <button type="button" class="small preset" data-range="month">This month</button>
          <button type="button" class="small preset" data-range="quarter">Last 3 months</button>
          <button type="button" class="small preset" data-range="year">This year</button>
        </div>
        <div class="row">
          <label>From <input type="date" id="exp-start"></label>
          <label>To <input type="date" id="exp-end"></label>
        </div>
        <ul id="exp-list" class="list"></ul>
        <div class="row"><strong id="exp-total"></strong><a id="exp-download" class="download" href="#">Download CSV</a></div>
      </div>
      <h2>Rules you taught me</h2>
      <ul id="rules" class="list"></ul>
    </section>

    <section class="col col-library" aria-labelledby="h-library">
      <h2 id="h-library">Library</h2>
      <nav id="tabs" class="tabs" aria-label="Filter by type"></nav>
      <div id="library" class="cards"></div>
    </section>

    <section class="col col-feed" aria-labelledby="h-feed">
      <h2 id="h-feed">What I'm doing</h2>
      <ol id="feed" class="feed"></ol>
    </section>
  </main>

  <div id="scrim" class="scrim hidden"></div>
  <aside id="drawer" class="drawer hidden" aria-label="File details"></aside>
  <script src="/static/app.js"></script>
</body>
</html>
